<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>记账本</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.9 8.6h16.2v9.6a1.9 1.9 0 0 1-1.9 1.9H5.8A1.9 1.9 0 0 1 3.9 18z"/><path d="M3.9 8.6 14.9 4.8a1.2 1.2 0 0 1 1.6.8l.8 3"/><circle cx="16.6" cy="13.4" r="1.15"/></svg></span>
        <span class="brand-text">记账本</span>
      </div>
            <nav class="nav" id="nav">
        <a class="nav-item" href="#/home" data-route="home"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.8V20h13V9.8"/><path d="M9.8 20v-5.6h4.4V20"/></svg></span>首页</a>
        <a class="nav-item" href="#/bills" data-route="bills"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M4.5 6h15"/><path d="M4.5 12h15"/><path d="M4.5 18h10"/></svg></span>账单</a>
        <a class="nav-item" href="#/stats" data-route="stats"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M4.8 20V11"/><path d="M10 20V4.6"/><path d="M15.2 20v-6.4"/><path d="M20.4 20V8.4"/></svg></span>统计</a>
        <a class="nav-item" href="#/budget" data-route="budget"><span class="nav-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="3.4"/></svg></span>预算<span class="nav-badge" id="budgetBadge" hidden></span></a>
        <a class="nav-item" href="#/categories" data-route="categories"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M3.8 12.2 12 4l8.2 8.2-8.2 8.2z"/><circle cx="9.4" cy="9.6" r="1.1"/></svg></span>分类</a>
        <a class="nav-item" href="#/settings" data-route="settings"><span class="nav-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"/><path d="M12 3.2v2.2M12 18.6v2.2M4.8 12H2.6M21.4 12h-2.2M6.9 6.9 5.3 5.3M18.7 18.7l-1.6-1.6M17.1 6.9l1.6-1.6M5.3 18.7l1.6-1.6"/></svg></span>设置</a>
      </nav>
      <div class="sidebar-foot">
        <span class="muted">今日</span>
        <strong id="todayBrief">¥0.00</strong>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 class="page-title" id="pageTitle">首页</h1>
        <div class="topbar-right">
          <div class="month-switch" id="monthSwitch" hidden>
            <button class="icon-btn" id="monthPrev" title="上个月" aria-label="上个月">‹</button>
            <button class="month-label" id="monthLabel" title="回到本月"></button>
            <button class="icon-btn" id="monthNext" title="下个月" aria-label="下个月">›</button>
          </div>
          <button class="btn btn-primary" id="quickAdd">＋ 记一笔</button>
        </div>
      </header>
      <section class="content" id="view" aria-live="polite"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <div id="offline" class="offline" hidden>
    <div class="offline-card">
      <h2>本地服务未连接</h2>
      <p>请双击项目文件夹里的 <code>启动记账.bat</code>，再点下面的重试。</p>
      <button class="btn btn-primary" id="retryBtn">重试</button>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
